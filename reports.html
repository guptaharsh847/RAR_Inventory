<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <button
      class="menu-toggle"
      onclick="document.querySelector('.sidebar').classList.toggle('active')"
    >
      ☰
    </button>

    <div class="sidebar">
      <div class="logo">
        <img src="assets/logo.png" alt="IMS Logo" />
        <h3>IMS</h3>
      </div>
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="stock.html">📦 Stock</a>
      <a href="sales.html">💰 Sales</a>
      <a href="labels.html">🏷 Labels</a>
      <a href="reports.html" class="active">📈 Reports</a>
      <a onclick="logout()" style="margin-top: auto">🚪 Logout</a>
    </div>

    <div class="content">
      <h2>Reports</h2>

      <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('sales')">
          Sales
        </button>
        <button class="tab-btn" onclick="switchTab('stock')">Stock</button>
        <button class="tab-btn" onclick="switchTab('inventory')">
          Inventory
        </button>
      </div>

      <div class="filters-container">
        <div class="date-inputs">
          <input type="date" id="startDate" class="input-sm" />
          <input type="date" id="endDate" class="input-sm" />
        </div>
        <div class="filter-actions">
          <button onclick="filterData()" class="btn-sm">Filter</button>
          <button
            onclick="downloadExcel()"
            class="btn-sm"
            style="background-color: var(--success)"
          >
            Excel
          </button>
        </div>
      </div>

      <table id="table">
        <thead></thead>
        <tbody id="tableBody"></tbody>
      </table>

      <div class="pagination">
        <button onclick="prevPage()">Previous</button>
        <span id="pageInfo">Page 1</span>
        <button onclick="nextPage()">Next</button>
      </div>
    </div>

    <script src="js/api.js"></script>

    <script>
      let allData = [];
      let filteredData = [];
      let currentPage = 1;
      let currentTab = "sales";
      const rowsPerPage = 10;

      // Initial Load
      switchTab("sales");

      function switchTab(tab) {
        currentTab = tab;
        currentPage = 1;
        allData = []; // Clear current data
        document.getElementById("tableBody").innerHTML =
          '<tr><td colspan="5">Loading...</td></tr>';

        // Update Buttons
        document.querySelectorAll(".tab-btn").forEach((btn) => {
          btn.classList.remove("active");
        });
        event.target.classList.add("active");

        // Fetch Data
        if (tab === "sales") {
          fetch(API_URL + "?action=sales")
            .then((res) => res.json())
            .then((data) => {
              allData = data.reverse();
              filteredData = [...allData];
              renderTable();
            });
        } else if (tab === "stock") {
          fetch(API_URL + "?action=stock")
            .then((res) => res.json())
            .then((data) => {
              allData = data.reverse();
              filteredData = [...allData];
              renderTable();
            });
        } else if (tab === "inventory") {
          // Use new fast API
          fetch(API_URL + "?action=inventory")
            .then((res) => res.json())
            .then((data) => {
              allData = data;
              filteredData = [...allData];
              renderTable();
            });
        }
      }

      function renderTable() {
        const thead = document.querySelector("#table thead");
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        thead.innerHTML = "";

        // Set Headers based on Tab
        let headers = "";
        if (currentTab === "sales")
          headers =
            "<tr><th>Date</th><th>Product</th><th>Qty</th><th>Amount</th><th>Payment</th></tr>";
        else if (currentTab === "stock")
          headers = "<tr><th>Date</th><th>Product</th><th>Qty</th></tr>";
        else if (currentTab === "inventory")
          headers = "<tr><th>Product</th><th>Remaining Qty</th></tr>";

        thead.innerHTML = headers;

        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageData = filteredData.slice(start, end);

        pageData.forEach((r) => {
          // Format Date
          const d = new Date(r.date);
          const dateStr = !isNaN(d)
            ? d.toLocaleDateString("en-US", {
                month: "short",
                day: "numeric",
                year: "numeric",
              })
            : r.date;

          let row = "";
          if (currentTab === "sales") {
            row = `<td>${dateStr}</td><td>${r.product}</td><td>${r.qty}</td><td>${r.amount}</td><td>${r.payment}</td>`;
          } else if (currentTab === "stock") {
            row = `<td>${dateStr}</td><td>${r.product}</td><td>${r.qty}</td>`;
          } else if (currentTab === "inventory") {
            row = `<td>${r.product}</td><td><strong>${r.qty}</strong></td>`;
          }
          tbody.innerHTML += `<tr>${row}</tr>`;
        });

        document.getElementById("pageInfo").innerText =
          `Page ${currentPage} of ${Math.ceil(filteredData.length / rowsPerPage) || 1}`;
      }

      function filterData() {
        const start = document.getElementById("startDate").value;
        const end = document.getElementById("endDate").value;

        if (!start || !end) {
          filteredData = [...allData];
        } else {
          filteredData = allData.filter((item) => {
            if (!item.date) return true; // Keep items without date (like inventory)
            return item.date >= start && item.date <= end;
          });
        }
        currentPage = 1;
        renderTable();
      }

      function downloadExcel() {
        let csv = [];
        // Get Headers
        const headers = Array.from(document.querySelectorAll("#table th")).map(
          (th) => th.innerText,
        );
        csv.push(headers.join(","));

        // Get Data
        filteredData.forEach((row) => {
          let rowData = [];
          if (currentTab === "sales") {
            rowData = [row.date, row.product, row.qty, row.amount, row.payment];
          } else if (currentTab === "stock") {
            rowData = [row.date, row.product, row.qty];
          } else if (currentTab === "inventory") {
            rowData = [row.product, row.qty];
          }
          csv.push(rowData.join(","));
        });

        const csvFile = new Blob([csv.join("\n")], { type: "text/csv" });
        const downloadLink = document.createElement("a");
        downloadLink.download = `${currentTab}_report.csv`;
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.click();
      }

      function prevPage() {
        if (currentPage > 1) {
          currentPage--;
          renderTable();
        }
      }

      function nextPage() {
        if (currentPage * rowsPerPage < filteredData.length) {
          currentPage++;
          renderTable();
        }
      }
      function logout() {
        localStorage.removeItem("token");
        window.location = "index.html";
      }
    </script>
  </body>
</html>
