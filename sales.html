<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <button
      class="menu-toggle"
      onclick="document.querySelector('.sidebar').classList.toggle('active')"
    >
      ☰
    </button>

    <div class="sidebar">
      <div class="logo">
        <img src="assets/logo.png" alt="IMS Logo" />
        <h3>IMS</h3>
      </div>
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="stock.html">📦 Stock</a>
      <a href="sales.html" class="active">💰 Sales</a>
      <a href="labels.html">🏷 Labels</a>
      <a href="reports.html">📈 Reports</a>
      <a onclick="logout()" style="margin-top: auto">🚪 Logout</a>
    </div>

    <div class="content">
      <h2>Sales Entry</h2>

      <div class="card">
        <select id="product"></select>

        <input id="qty" placeholder="Quantity" />

        <input id="amount" placeholder="Amount" />

        <input type="date" id="date" />

        <select id="payment">
          <option>Cash</option>
          <option>Online</option>
        </select>

        <button onclick="saveSales()">Save</button>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/sales.js"></script>
    <script>
      function logout() {
        localStorage.removeItem("token");
        window.location = "index.html";
      }
    </script>
  </body>
</html>
