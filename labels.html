<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Labels · Roast and Root</title>
    <link rel="icon" type="image/png" sizes="48x48" href="assets/icons/icon-48x48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1d1511">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body data-title="Labels">
    <script src="js/nav.js"></script>

    <main class="content">
      <div class="page-header">
        <div>
          <h1 class="page-title">Label Generator</h1>
          <p class="subtitle">Fill in the details and download a ready-to-print label sheet</p>
        </div>
      </div>

      <div class="card label-card">
        <h3>Label details</h3>
        <div class="form-grid">
          <div>
            <label class="field-label" for="weight">Net weight</label>
            <input id="weight" placeholder="e.g. 500g" />
          </div>
          <div>
            <label class="field-label" for="mrp">MRP</label>
            <input id="mrp" placeholder="e.g. 499" />
          </div>
          <div>
            <label class="field-label" for="mfd">Manufacturing date</label>
            <input type="text" id="mfd" placeholder="DD-MM-YYYY" onfocus="(this.type='date')" onblur="(this.value ? this.type='date' : this.type='text')" />
          </div>
          <div>
            <label class="field-label" for="batch">Batch no.</label>
            <input id="batch" placeholder="e.g. RR-1024" />
          </div>
        </div>
        <button type="button" onclick="generate()" class="btn-send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          Generate labels
        </button>
      </div>
    </main>

    <script src="https://unpkg.com/pizzip@3.1.7/dist/pizzip.js"></script>
    <script src="https://unpkg.com/docxtemplater@3.40.2/build/docxtemplater.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/labels.js"></script>
  </body>
</html>
