<!doctype html>
<html>
  <head>
    <meta
      charset="utf-8"
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>IMS Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="assets/logo.png" />
    <meta name="theme-color" content="#4f46e5" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <!-- Mobile Top Header -->
    <div class="top-header">
      <button
        class="menu-toggle"
        aria-label="Open Menu"
        onclick="toggleSidebar()"
      >
        <svg
          viewBox="0 0 24 24"
          width="24"
          height="24"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="header-title">IMS Dashboard</div>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
      <div class="logo">
        <img src="assets/logo.png" alt="IMS Logo" />
        <h3>IMS</h3>
      </div>

      <a href="dashboard.html" class="active"><span>📊</span> Dashboard</a>
      <a href="stock.html"><span>📦</span> Stock</a>
      <a href="sales.html"><span>💰</span> Sales</a>
      <a href="labels.html"><span>🏷</span> Labels</a>

      <a
        onclick="logout()"
        style="margin-top: auto; cursor: pointer; color: #ef4444"
        ><span>🚪</span> Logout</a
      >
    </div>

    <div class="content">
      <div class="dashboard-header">
        <div>
          <h2 class="page-title">Overview</h2>
          <p class="subtitle">Track your inventory and sales</p>
        </div>
        <button class="btn-refresh" onclick="refreshDashboardData()">
          🔄 Refresh Data
        </button>
      </div>

      <div class="card metric-card">
        <div class="card-top">
          <h3>Total Sales</h3>
          <input
            type="month"
            id="monthFilter"
            class="month-picker"
            title="Select Month"
            onchange="loadDashboardSales()"
          />
        </div>
        <div class="metric-value">
          <h1 id="totalSales">0.00</h1>
          <span class="badge" id="salesCount">0 orders</span>
        </div>
      </div>

      <div class="card">
        <h3>Current Inventory</h3>
        <div class="table-container">
          <table id="inventoryTable">
            <thead>
              <tr>
                <th>📦 Product</th>
                <th style="text-align: right">⚖️ Quantity</th>
              </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- PWA Install Popup -->
    <div id="pwaPopup" class="pwa-popup">
      <div class="pwa-info">
        <img src="assets/logo.png" alt="App Icon" />
        <div class="pwa-text">
          <h4>Install IMS</h4>
          <p>Add to home screen</p>
        </div>
      </div>
      <div class="pwa-actions">
        <button id="pwaInstallBtn">Install</button>
        <button id="pwaCloseBtn" class="pwa-close">✖</button>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script>
      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
        document.querySelector(".sidebar-overlay").classList.toggle("active");
      }

      function logout() {
        localStorage.removeItem("token");
        window.location = "index.html";
      }

      let deferredPrompt;
      const pwaPopup = document.getElementById("pwaPopup");

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        setTimeout(() => pwaPopup.classList.add("show"), 1500);
      });

      document
        .getElementById("pwaInstallBtn")
        .addEventListener("click", async () => {
          if (deferredPrompt) {
            pwaPopup.classList.remove("show");
            deferredPrompt.prompt();
            deferredPrompt = null;
          }
        });

      document.getElementById("pwaCloseBtn").addEventListener("click", () => {
        pwaPopup.classList.remove("show");
      });
    </script>
  </body>
</html>
