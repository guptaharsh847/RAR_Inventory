<!doctype html>
<html>
  <head>
    <meta
      charset="utf-8"
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <title>IMS Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="assets/logo.png" />
    <meta name="theme-color" content="#4f46e5" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <!-- Mobile Top Header -->
    <div class="top-header">
      <button
        class="menu-toggle"
        aria-label="Open Menu"
        onclick="toggleSidebar()"
      >
        <svg
          viewBox="0 0 24 24"
          width="24"
          height="24"
          stroke="currentColor"
          stroke-width="2"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="header-title">IMS Dashboard</div>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
      <div class="logo">
        <img src="assets/logo.png" alt="IMS Logo" />
        <h3>IMS</h3>
      </div>

      <a href="dashboard.html" class="active"
        ><svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="7" height="9"></rect>
          <rect x="14" y="3" width="7" height="5"></rect>
          <rect x="14" y="12" width="7" height="9"></rect>
          <rect x="3" y="16" width="7" height="5"></rect>
        </svg>
        Dashboard</a
      >
      <a href="stock.html"
        ><svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
          ></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        Stock</a
      >
      <a href="sales.html"
        ><svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        Sales</a
      >
      <a href="labels.html"
        ><svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
          ></path>
          <line x1="7" y1="7" x2="7.01" y2="7"></line>
        </svg>
        Labels</a
      >

      <a
        onclick="logout()"
        style="margin-top: auto; cursor: pointer; color: #ef4444"
        ><svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Logout</a
      >
    </div>

    <div class="content">
      <div class="dashboard-header">
        <div>
          <h2 class="page-title">Overview</h2>
          <p class="subtitle">Track your inventory and sales</p>
        </div>
        <button
          class="btn-refresh"
          onclick="refreshDashboardData()"
          style="display: flex; gap: 8px; align-items: center"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path
              d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"
            ></path>
          </svg>
          Refresh Data
        </button>
      </div>

      <div class="card metric-card">
        <div class="card-top">
          <h3>Total Sales</h3>
          <input
            type="month"
            id="monthFilter"
            class="month-picker"
            title="Select Month"
            onchange="loadDashboardSales()"
          />
        </div>
        <div class="metric-value">
          <h1 id="totalSales">0.00</h1>
          <span class="badge" id="salesCount">0 orders</span>
        </div>
      </div>

      <div class="card">
        <h3>Current Inventory</h3>
        <div class="table-container">
          <table id="inventoryTable">
            <thead>
              <tr>
                <th>
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    style="vertical-align: text-bottom; margin-right: 4px"
                  >
                    <path
                      d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
                    ></path>
                  </svg>
                  Product
                </th>
                <th style="text-align: right">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    style="vertical-align: text-bottom; margin-right: 4px"
                  >
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                  </svg>
                  Quantity
                </th>
              </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- PWA Install Popup -->
    <div id="pwaPopup" class="pwa-popup">
      <div class="pwa-info">
        <img src="assets/logo.png" alt="App Icon" />
        <div class="pwa-text">
          <h4>Install IMS</h4>
          <p>Add to home screen</p>
        </div>
      </div>
      <div class="pwa-actions">
        <button id="pwaInstallBtn">Install</button>
        <button id="pwaCloseBtn" class="pwa-close">✖</button>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script>
      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("active");
        document.querySelector(".sidebar-overlay").classList.toggle("active");
      }

      function logout() {
        localStorage.removeItem("token");
        window.location = "index.html";
      }

      let deferredPrompt;
      const pwaPopup = document.getElementById("pwaPopup");

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        setTimeout(() => pwaPopup.classList.add("show"), 1500);
      });

      document
        .getElementById("pwaInstallBtn")
        .addEventListener("click", async () => {
          if (deferredPrompt) {
            pwaPopup.classList.remove("show");
            deferredPrompt.prompt();
            deferredPrompt = null;
          }
        });

      document.getElementById("pwaCloseBtn").addEventListener("click", () => {
        pwaPopup.classList.remove("show");
      });
    </script>
  </body>
</html>
