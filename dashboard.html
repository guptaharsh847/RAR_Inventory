<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width" />

    <link rel="stylesheet" href="css/style.css" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <button
      class="menu-toggle"
      onclick="document.querySelector('.sidebar').classList.toggle('active')"
    >
      ☰
    </button>

    <div class="sidebar">
      <div class="logo">
        <img src="assets/logo.png" alt="IMS Logo" />
        <h3>IMS</h3>
      </div>

      <a href="dashboard.html" class="active">📊 Dashboard</a>
      <a href="stock.html">📦 Stock</a>
      <a href="sales.html">💰 Sales</a>
      <a href="labels.html">🏷 Labels</a>
      <a href="reports.html">📈 Reports</a>

      <a onclick="logout()" style="margin-top: auto">🚪 Logout</a>
    </div>

    <div class="content">
      <h2>Dashboard</h2>

      <div class="card">
        <h3>Total Sales</h3>
        <div style="margin-bottom: 15px">
          <label>Select Month:</label>
          <input
            type="month"
            id="monthFilter"
            onchange="loadDashboardSales()"
          />
        </div>
        <h1 id="totalSales" style="color: var(--primary); font-size: 2.5rem">
          0.00
        </h1>
        <p id="salesCount" style="color: var(--secondary)">0 orders</p>
      </div>

      <div class="card">
        <h3>Current Inventory</h3>
        <table id="inventoryTable">
          <thead>
            <tr>
              <th>Product</th>
              <th>Quantity</th>
            </tr>
          </thead>
          <tbody id="inventoryBody"></tbody>
        </table>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script>
      function logout() {
        localStorage.removeItem("token");
        window.location = "index.html";
      }
    </script>
  </body>
</html>
