<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>IMS Login</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="assets/logo.png" />
    <meta name="theme-color" content="#4f46e5" />
  </head>

  <body>
    <div class="login-container">
      <div class="login-left">
        <div class="login-card">
          <img src="assets/logo.png" class="logo" alt="IMS Logo" />
          <h2>Welcome Back</h2>
          <p class="subtitle">Enter your 6-digit PIN to securely log in</p>
          <div class="pin-container" id="pinContainer">
            <input
              type="password"
              class="pin-box"
              maxlength="1"
              id="pin1"
              autofocus
            />
            <input type="password" class="pin-box" maxlength="1" id="pin2" />
            <input type="password" class="pin-box" maxlength="1" id="pin3" />
            <input type="password" class="pin-box" maxlength="1" id="pin4" />
            <input type="password" class="pin-box" maxlength="1" id="pin5" />
            <input type="password" class="pin-box" maxlength="1" id="pin6" />
          </div>
          <button onclick="login()">Sign In</button>
        </div>
      </div>

      <!-- Image Carousel Container -->
      <div class="login-right" id="carouselContainer">
        <!-- Images injected dynamically via JavaScript -->
      </div>
    </div>

    <!-- PWA Install Popup -->
    <div id="pwaPopup" class="pwa-popup">
      <div class="pwa-info">
        <img src="assets/logo.png" alt="App Icon" />
        <div class="pwa-text">
          <h4>Install IMS</h4>
          <p>Add to home screen</p>
        </div>
      </div>
      <div class="pwa-actions">
        <button id="pwaInstallBtn">Install</button>
        <button id="pwaCloseBtn" class="pwa-close">✖</button>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      // PIN Box auto-focus logic
      const pinBoxes = document.querySelectorAll(".pin-box");
      pinBoxes.forEach((box, index) => {
        box.addEventListener("input", (e) => {
          if (e.target.value.length === 1 && index < pinBoxes.length - 1) {
            pinBoxes[index + 1].focus();
          }
        });
        box.addEventListener("keydown", (e) => {
          if (
            e.key === "Backspace" &&
            e.target.value.length === 0 &&
            index > 0
          ) {
            pinBoxes[index - 1].focus();
          } else if (
            e.key === "Enter" &&
            index === pinBoxes.length - 1 &&
            e.target.value.length === 1
          ) {
            login();
          }
        });
      });

      // Carousel Logic
      const carouselContainer = document.getElementById("carouselContainer");
      let carouselHTML = "";

      for (let i = 1; i <= 6; i++) {
        // Change 'img${i}.jpeg' to '${i}.jpeg' if your files are strictly named 1.jpeg, 2.jpeg, etc.
        carouselHTML += `<img src="assets/images/img${i}.jpeg" class="carousel-slide ${i === 1 ? "active" : ""}" alt="Slide ${i}" onerror="this.remove()" />`;
      }
      carouselContainer.innerHTML = carouselHTML;

      let currentSlide = 0;
      setInterval(() => {
        const slides = document.querySelectorAll(".carousel-slide");
        if (slides.length > 0) {
          if (currentSlide >= slides.length) currentSlide = 0; // Prevent out-of-bounds
          slides[currentSlide].classList.remove("active");
          currentSlide = (currentSlide + 1) % slides.length;
          slides[currentSlide].classList.add("active");
        }
      }, 3000); // 3 seconds

      let deferredPrompt;
      const pwaPopup = document.getElementById("pwaPopup");

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        setTimeout(() => pwaPopup.classList.add("show"), 1000);
      });

      document
        .getElementById("pwaInstallBtn")
        .addEventListener("click", async () => {
          if (deferredPrompt) {
            pwaPopup.classList.remove("show");
            deferredPrompt.prompt();
            deferredPrompt = null;
          }
        });

      document.getElementById("pwaCloseBtn").addEventListener("click", () => {
        pwaPopup.classList.remove("show");
      });
    </script>
  </body>
</html>
