<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <button
      class="menu-toggle"
      onclick="document.querySelector('.sidebar').classList.toggle('active')"
    >
      ☰
    </button>

    <div class="sidebar">
      <div class="logo">
        <img src="assets/logo.png" alt="IMS Logo" />
        <h3>IMS</h3>
      </div>

      <a href="dashboard.html">📊 Dashboard</a>
      <a href="stock.html" class="active">📦 Stock</a>
      <a href="sales.html">💰 Sales</a>
      <a href="labels.html">🏷 Labels</a>
      <a href="reports.html">📈 Reports</a>

      <a onclick="logout()" style="margin-top: auto">🚪 Logout</a>
    </div>

    <div class="content">
      <h2>Stock Entry</h2>

      <div class="card">
        <label for="product">Product</label>
        <select id="product" title="Select Product"></select>

        <label for="qty">Quantity</label>
        <input id="qty" placeholder="Quantity" title="Enter Quantity" />

        <label for="date">Date</label>
        <input type="date" id="date" title="Select Date" />

        <button onclick="saveStock()">Save</button>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/stock.js"></script>
    <script>
      function logout() {
        localStorage.removeItem("token");
        window.location = "index.html";
      }
    </script>
  </body>
</html>
